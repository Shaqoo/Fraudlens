[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens"
version = "0.1.0"
description = "Intelligent transaction risk detection, ETL and monitoring platform"
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "huggingface-hub>=0.30",
    "kaggle>=1.6",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "APScheduler>=3.10",
    "python-multipart>=0.0.9",
    "streamlit>=1.32",
    "plotly>=5.20",
    "requests>=2.31",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
fraudlens-etl = "fraudlens.cli:etl_main"
fraudlens-train = "fraudlens.cli:train_main"
fraudlens-scheduler = "fraudlens.cli:scheduler_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
