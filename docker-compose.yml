services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudlens
      POSTGRES_USER: fraudlens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens_user -d fraudlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fraudlens_user:${POSTGRES_PASSWORD:-fraudlens}@db:5432/fraudlens
    command: uvicorn fraudlens.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fraudlens_user:${POSTGRES_PASSWORD:-fraudlens}@db:5432/fraudlens
    command: fraudlens-scheduler
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
